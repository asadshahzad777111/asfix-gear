# Free local stack matching Render: n8n (community) + PostgreSQL
# Usage:
#   docker compose up -d
# Open http://localhost:5678
#
# Render production uses n8n/Dockerfile + Render Postgres (not this file).
# See n8n/RENDER-FREE-SETUP.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - n8n_pg:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      PORT: '5678'
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Karachi
      TZ: Asia/Karachi
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_ENCRYPTION_KEY: local-dev-only-change-me-32chars!!
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  n8n_pg:
