<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="ASP — Is The Name Of Trust — ASFINS.COM">
  <!-- Shop-banner ASP mark: yellow hexagon + website (no email) -->
  <rect width="640" height="640" fill="#000000"/>

  <!-- Tall yellow hexagon (banner badge) -->
  <path
    d="M320 48 L430 112 L430 392 L320 456 L210 392 L210 112 Z"
    fill="#FFCC00"
    stroke="#111111"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- ASP stacked (main logo letters) -->
  <g fill="#000000" font-family="Arial Black, Impact, Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="292" y="178" font-size="96">A</text>
    <text x="292" y="278" font-size="96">S</text>
    <text x="292" y="378" font-size="96">P</text>
  </g>

  <!-- Slogan: Is The Name Of Trust (beside ASP, vertical) -->
  <text
    transform="translate(368 130) rotate(90)"
    fill="#000000"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="1.6"
  >IS THE NAME OF TRUST</text>

  <!-- Website replaces email -->
  <text
    x="320"
    y="520"
    fill="#FFCC00"
    font-family="Arial Black, Impact, Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="3"
    text-anchor="middle"
  >ASFINS.COM</text>

  <text
    x="320"
    y="566"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="5"
    text-anchor="middle"
  >ASPLYWOOD</text>
</svg>
