      font-size="54"
      font-weight="700"
    >?? ??? ????? ??</text>
  </g>

  <!-- Compact regular hexagon (short/wide, NOT elongated) -->
  <path
    d="M400 150
       L500 208
       L500 324
       L400 382
       L300 324
       L300 208 Z"
