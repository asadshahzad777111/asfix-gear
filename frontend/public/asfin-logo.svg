    <text x="372" y="282" font-size="52">S</text>
    <text x="372" y="334" font-size="52">P</text>
  </g>

  <!-- Divider -->
  <line x1="408" y1="190" x2="408" y2="350" stroke="#000" stroke-width="2.5"/>

  <!-- Slogan + website (vertical column) -->
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="700">
