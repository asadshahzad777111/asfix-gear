<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="?? ??? ????? ?? — ASP — Is The Name Of Trust — ASFINS.COM">
  <!-- Wide box (width > height), ASP spaced wide, ASFINS.COM only inside, extra outer margin -->
  <rect width="640" height="640" fill="#000000"/>

  <!-- Urdu shop name above -->
  <g fill="#FFD400">
    <path d="M308 72 L320 54 L332 72 L320 90 Z"/>
    <path d="M286 92 L298 74 L310 92 L298 110 Z"/>
    <path d="M330 92 L342 74 L354 92 L342 110 Z"/>
    <text
