<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="?? ??? ????? ?? — ASP Is The Name Of Trust — ASFINS.COM">
  <!-- Compact banner mark: short hexagon (not tall), Urdu shop name, website not email -->
  <rect width="640" height="640" fill="#000000"/>

  <!-- Urdu shop name (AS Plywood) — left, yellow calligraphy feel -->
  <g fill="#FFD400" text-anchor="middle">
    <!-- three diamond dots -->
    <path d="M118 118 L128 102 L138 118 L128 134 Z"/>
    <path d="M98 138 L108 122 L118 138 L108 154 Z"/>
    <path d="M138 138 L148 122 L158 138 L148 154 Z"/>
    <text
