<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AsFix & Gear by Asad Shahzad — Expert mobile repair & premium accessories. WhatsApp: 03039227000. Open 9 AM – 9 PM." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <title>AsFix & Gear | Mobile Repair & Accessories — Asad Shahzad</title>
    <link rel="dns-prefetch" href="https://asfix-gear.onrender.com" />
    <link rel="preconnect" href="https://asfix-gear.onrender.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Expressive display + sans (Locomotive-inspired energy — not Inter/system defaults) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #0a0a0a;
        color: #f2f2f0;
        font-family: Syne, system-ui, sans-serif;
      }
      #boot-splash strong {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      #boot-splash span { opacity: 0.65; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; }
      html[data-theme='light'] #boot-splash { background: #f7f7f5; color: #0a0a0a; }
    </style>
    <script>
      (function () {
        var mode = localStorage.getItem('asfix-theme') || 'auto';
        var theme = mode;
        if (mode === 'auto') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-theme-mode', mode);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-live="polite" aria-busy="true">
        <strong>AsFix &amp; Gear</strong>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
