<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AsFix & Gear</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, sans-serif;
        background: #0c0d10;
        color: #f4f4f5;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      a { color: #fb923c; }
      p { max-width: 28rem; line-height: 1.45; opacity: 0.9; }
      code { font-size: 0.9em; }
    </style>
  </head>
  <body>
    <main>
      <h1>AsFix &amp; Gear</h1>
      <p>
        This shell normally loads <strong>https://asfixgear.com</strong> via Capacitor
        <code>server.url</code>. If you see this page, sync succeeded but the remote URL
        was not applied — check <code>capacitor.config.json</code>.
      </p>
      <p><a href="https://asfixgear.com">Open storefront in browser</a></p>
    </main>
  </body>
</html>
