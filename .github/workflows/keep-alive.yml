# Render free tier sleeps after ~15 min idle. Ping every 5 min keeps it warm.
# Uses curl retries to wake a cold instance (can take 1–3 min once per wake cycle).
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Render (free tier cold start)
        run: |
          set -e
          URL="https://asfix-gear.onrender.com/api/health"
          echo "Waking $URL ..."
          curl -fS --retry 25 --retry-delay 10 --retry-all-errors \
            --connect-timeout 25 --max-time 45 \
            "$URL" | head -c 200
          echo ""
          echo "Render health check passed"
