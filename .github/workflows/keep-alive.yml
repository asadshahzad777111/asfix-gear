# Render free tier sleeps after ~15 min idle — wake can take 60–120s on cold start.
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake production (retry — cold start is slow)
        run: |
          set -e
          URLS="https://asfix-gear.onrender.com/api/health https://asfixgear.com/api/health"
          for url in $URLS; do
            for attempt in 1 2 3; do
              echo "=== $url attempt $attempt/3 ==="
              if resp=$(curl -sS --connect-timeout 30 --max-time 120 "$url" 2>/dev/null); then
                if echo "$resp" | grep -q 'AsFix'; then
                  echo "OK: $url"
                  echo "$resp"
                  exit 0
                fi
              fi
              echo "No response yet — waiting 20s before retry..."
              sleep 20
            done
          done
          echo "Failed to wake Render after all attempts"
          exit 1
