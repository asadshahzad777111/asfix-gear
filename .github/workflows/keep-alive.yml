# Render free tier sleeps after ~15 min idle — first refresh then waits 30–90s
# for the server to wake (browser tab keeps spinning). Ping every 5 min keeps it warm.
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping production health
        run: |
          curl -sf --max-time 45 "https://asfixgear.com/api/health" | grep -q '"brand":"AsFix & Gear"'
          echo "asfixgear.com is awake"
