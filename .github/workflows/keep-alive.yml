# Render free tier sleeps after ~15 min idle. Ping every 5 min keeps it warm.
# Uses curl retries to wake a cold instance (can take 1–3 min once per wake cycle).
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Render (free tier cold start)
        run: |
          set -e
          URL="https://asfix-gear.onrender.com/api/ping"
          echo "Waking $URL ..."
          curl -fS --retry 20 --retry-delay 8 --retry-all-errors \
            --connect-timeout 20 --max-time 30 \
            "$URL"
          echo "Render is awake"
